<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quit without saving? - the shipped guard, as a sheet</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
</head>
<body>

<!-- `may_exit_page_helper.dart:14-44` - the guard every edit surface shares. All four strings are
     shipped verbatim: `edit_product_form_item_exit_title` = "Quit without saving?",
     `_exit_confirmation` = "Do you want to save your changes before leaving this page?",
     `_exit_confirmation_positive_button` = "Save changes",
     `_exit_confirmation_negative_button` = "Discard changes".

     ⛔ THREE THINGS CHANGE, and all three are the standing sheet rule, not taste
     (design-system.md §3i, Urban 2026-08-22):
     1. NO ✕. Frame v1_t069 draws a close button top-right on this exact dialog. The grabber,
        swipe-down and the scrim are the exit.
     2. One stop, content height, dimmed scrim behind it - it is not a full-bleed red panel.
     3. The shipped version paints the whole sheet with the error colour. A question is not an
        error: the destructive CHOICE is what carries the colour, not the container. -->

<div class="app">

  <div class="dim">
    <div class="sbar">
      <span class="back">&#8592;</span>
      <h1>Nutrition Facts</h1>
    </div>

    <div class="pident">
      <span class="ph"><img src="https://images.openfoodfacts.org/images/products/380/020/587/2962/front_en.3.400.jpg" alt="Bruschette chips pizza front photo"></span>
      <span class="t">
        <b>Bruschette chips pizza</b>
        <i>Maretti</i>
        <code>3800205872962</code>
      </span>
    </div>

    <div class="pcard2">
      <h3>Nutrition facts</h3>
      <div class="perrow">
        <span class="t">Nutritional values:</span>
        <span class="sel">per 100g <span class="g">&#9662;</span></span>
      </div>
      <div class="nrow">
        <span class="nm">Energy (kJ)</span>
        <span class="fld">1906.1</span>
        <span class="unit"><span class="sel">kj</span></span>
        <span class="eye">&#128065;</span>
      </div>
      <div class="nrow">
        <span class="nm">Energy (kcal)</span>
        <span class="fld">453</span>
        <span class="unit"><span class="sel">kcal</span></span>
        <span class="eye">&#128065;</span>
      </div>
      <!-- ⛔ This row first drew `0.8` as the unsaved edit and that is INVENTED DATA - a number a
           contributor typed is still a number on the screen, and `salt_100g` is null on this
           product (design-system.md §4 rule 0). The sheet itself is the state being drawn; the
           table underneath stays exactly what the API returns. -->
      <div class="nrow">
        <span class="nm">Salt</span>
        <span class="fld empty">&#8212;</span>
        <span class="unit"><span class="sel">g <span class="g">&#9662;</span></span></span>
        <span class="eye">&#128065;</span>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="grab"><span class="bar"></span></div>
    <div class="shd"><i></i><h2>Quit without saving?</h2><span class="spacer"></span></div>
    <div class="sbody">
      <p class="sq">Do you want to save your changes before leaving this page?</p>
      <a class="srow2" href="edit-nutrition.html"><span class="t"><b>Save changes</b></span></a>
      <a class="srow2 drop" href="edit-hub.html"><span class="t"><b>Discard changes</b></span></a>
    </div>
  </div>

</div>

</body>
</html>
