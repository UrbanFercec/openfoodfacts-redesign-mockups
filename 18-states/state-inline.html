<div class="app">

  <div class="sbar">
    <a class="back" href="../07-search/search-results.html">&#8592;</a>

  <div class="pshell">

    <div class="ptitle">Nutella</div>

    <div class="tile">

    <div class="tile">
      <h3>Ingredients</h3>
      <div class="vals">
        <span><span class="d warn"></span>Maybe vegetarian</span>
        <span><span class="d bad"></span>Palm oil</span>

  </div>
