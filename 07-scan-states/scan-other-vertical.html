<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan - the barcode is in another Open Facts database</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
</head>
<body>

<div class="app full">

  <div class="scan">
    <div class="ctop">
      <a class="chip" href="scan-default.html">Clear</a>
      <span class="chip off" title="Please scan at least two products to compare them">Compare one Product</span>
      <span class="spacer"></span>
      <span class="cbtn" title="Toggle camera">&#8646;</span>
      <span class="cbtn" title="Toggle torch">&#9788;</span>
    </div>

    <div class="reticle"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="glyph"></span></div>

    <div class="csheet">
      <div class="grab">
        <span class="bar"></span>
      </div>
      <div class="chd">
        <i></i>
        <h2>Personal care</h2>
      </div>
      <div class="cbody">
        <div class="pident">
          <div class="thumb"><img src="https://images.openbeautyfacts.org/images/products/333/787/559/8996/front_en.28.200.jpg" alt=""></div>
          <div class="t">
            <div class="nm">Moisturising cream</div>
            <div class="sub">CeraVe</div>
            <div class="sub"><span class="pill quiet">Open Beauty Facts</span></div>
          </div>
        </div>

        <p class="note">This barcode is a <b>cosmetic</b>, so it lives in
           Open&nbsp;Beauty&nbsp;Facts rather than here. The record is already there, with 89% of
           its data filled in.</p>
      </div>
      <a class="cfoot" href="../22-verticals/product-beauty.html">
        <span>Open it in Open Beauty Facts</span>
        <span class="spacer"></span>
        <span>&rarr;</span>
      </a>
    </div>
  </div>

  <div class="tabbar">
    <a href="../03-home/home-app.html"><span class="g">&#9750;</span>Home</a>
    <a class="on"><span class="g">&#9678;</span>Scan</a>
    <a href="../08-lists/lists-history.html"><span class="g">&#9782;</span>Lists</a>
    <a href="../04-profile/profile-in.html"><span class="g">&#9787;</span>Profile</a>
  </div>

</div>

</body>
</html>
