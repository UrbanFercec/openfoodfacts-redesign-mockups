<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan - a barcode was detected</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
</head>
<body>

<!-- shell: Scan tab = the FULL-SCREEN scanner, and a scanned product arrives as a bottom sheet over the video (shell-contract.md line 16). The flat four-slot bar stays on it, because Scan is a TAB and not a modal (same file, the block CLOSED 2026-08-18). -->

<div class="app full">

  <div class="scan">
    <div class="ctop">
      <a class="chip" href="scan-default.html">Clear</a>
      <span class="chip off" title="Please scan at least two products to compare them">Compare one Product</span>
      <span class="spacer"></span>
      <span class="cbtn" title="Toggle camera">&#8646;</span>
      <span class="cbtn" title="Toggle torch">&#9788;</span>
    </div>

    <div class="reticle"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="glyph"></span></div>

    <!-- ⛔ KEPT, deliberately: the shipped loading state brags about the database size
         (`carousel_loading_text`) and it is the only place in the app that does. A spinner
         would have been shorter and would have thrown that away.
         Their own artboard 22 draws exactly this as a sheet - `Code-barres detecte !` with the
         barcode underlined in the sentence - so the container is theirs and the words are the
         shipped English ones. -->
    <div class="csheet">
      <div class="grab"><span class="bar"></span></div>
      <div class="chd">
        <i></i>
        <h2>Loading information...</h2>
      </div>
      <div class="cbody">
        <div class="msg">
          <div class="spin"></div>
          <p>You've just scanned a product with the following barcode:</p>
          <span class="bar">3800205872962</span>
          <p>We are searching for it in our database of more than <b>3 million products!</b></p>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <a href="../03-home/home-app.html"><span class="g">&#9750;</span>Home</a>
    <a class="on"><span class="g">&#9678;</span>Scan</a>
    <a href="../08-lists/lists-history.html"><span class="g">&#9782;</span>Lists</a>
    <a href="../04-profile/profile-in.html"><span class="g">&#9787;</span>Profile</a>
  </div>

</div>

</body>
</html>
