<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan - a product with full data</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
<script src="../shared/proto-nav.js" defer></script>
</head>
<body>

<div class="app full">

  <div class="scan">
    <div class="ctop">
      <a class="chip" href="scan-default.html">Clear</a>
      <a class="chip off" title="Please scan at least two products to compare them" href="../10-compare/compare-empty.html">Compare one Product</a>
      <span class="spacer"></span>
      <span class="cbtn" title="Toggle camera">&#8646;</span>
      <span class="cbtn" title="Toggle torch">&#9788;</span>
    </div>

    <div class="reticle"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="glyph"></span></div>

    <div class="csheet">
      <div class="grab">
        <span class="bar"></span>
      </div>
      <div class="cbody">
        <div class="pident">
          <div class="thumb"><img src="https://images.openfoodfacts.org/images/products/730/040/048/1588/front_en.269.200.jpg" alt=""></div>
          <div class="t">
            <div class="nm">Fibres</div>
            <div class="sub">wasa &middot; 230 g</div>
            <div class="sub"><span class="pill quiet"><b class="badge">78%</b>Very good match</span></div>
          </div>
        </div>

        <div class="srows">
          <a class="srow2" title="Stand-in: this product's own page is not drawn, so it opens the one that is" href="../01-product-page/product-nutella.html">
            <img src="https://static.openfoodfacts.org/images/attributes/dist/nutriscore-a-new-en.svg" alt="Nutri-Score A">
            <span class="t"><b>Nutri-Score A</b><i>Very good nutritional quality</i></span>
          </a>
          <a class="srow2" title="Stand-in: this product's own page is not drawn, so it opens the one that is" href="../01-product-page/product-nutella.html">
            <img src="https://static.openfoodfacts.org/images/attributes/dist/green-score-a-plus.svg" alt="Green-Score A+">
            <span class="t"><b>Green-Score A+</b><i>Very low environmental impact</i></span>
          </a>
          <a class="srow2" title="Stand-in: this product's own page is not drawn, so it opens the one that is" href="../01-product-page/product-nutella.html">
            <img src="https://static.openfoodfacts.org/images/attributes/dist/nova-group-3.svg" alt="Processed foods">
            <span class="t"><b>Processed foods</b></span>
          </a>
        </div>
      </div>
      <a class="cfoot todo" title="The product page is drawn for Nutella only, not for this barcode">
        <span>Tap to see more info&hellip;</span>
        <span class="spacer"></span>
        <span>&rarr;</span>
      </a>
    </div>
  </div>

  <div class="tabbar">
    <a href="../03-home/home-app.html"><span class="g">&#9750;</span>Home</a>
    <a class="on"><span class="g">&#9678;</span>Scan</a>
    <a href="../08-lists/lists-history.html"><span class="g">&#9782;</span>Lists</a>
    <a href="../04-profile/profile-in.html"><span class="g">&#9787;</span>Profile</a>
  </div>

</div>

</body>
</html>
