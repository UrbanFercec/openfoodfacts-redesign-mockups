<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan - a product with full data, the peek</title>
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="../shared/proto.css">
<script src="../shared/proto-theme.js" defer></script>
</head>
<body>

<!-- shell: Scan tab = the FULL-SCREEN scanner, and a scanned product arrives as a bottom sheet over the video (shell-contract.md line 16). The flat four-slot bar stays on it, because Scan is a TAB and not a modal (same file, the block CLOSED 2026-08-18). -->

<div class="app full">

  <div class="scan">
    <div class="ctop">
      <a class="chip" href="scan-default.html">Clear</a>
      <span class="chip off" title="Please scan at least two products to compare them">Compare one Product</span>
      <span class="spacer"></span>
      <span class="cbtn" title="Toggle camera">&#8646;</span>
      <span class="cbtn" title="Toggle torch">&#9788;</span>
    </div>

    <div class="reticle"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><span class="glyph">&#9906;</span></div>

    <!-- ⭐ THE PEEK. This is the height their `Scanner carte 3` and their artboard 23 draw: who it
         is, how well it matches you, and the one verdict that matters. Everything else is one drag
         away (scan-found-open.html), which is what their `Glisser vers le haut pour en savoir
         plus` promises and what `expandable_camera.dart` already implements.
         ⛔ THE STATE NOBODY HAS A PICTURE OF - neither device recording caught a full-data card,
         so the content is the shipped card's structure plus live data: wasa Fibres 7300400481588,
         78% / VERY_GOOD_MATCH computed with OFF's own algorithm (screens/05-search/match.py). -->
    <div class="csheet">
      <div class="swipe"><span>&#9650;</span></div>
      <div class="grab">
        <span class="bar"></span>
        <a class="x" href="scan-default.html" title="Remove this product from the carousel">&#10005;</a>
      </div>
      <div class="cbody">
        <div class="pident">
          <div class="thumb"><img src="https://images.openfoodfacts.org/images/products/730/040/048/1588/front_en.269.200.jpg" alt=""></div>
          <div class="t">
            <div class="nm">Fibres</div>
            <div class="sub">wasa &middot; 230 g</div>
            <div class="sub"><span class="pill quiet"><b class="badge">78%</b>Very good match</span></div>
          </div>
        </div>

        <div class="srows">
          <div class="srow2">
            <img src="https://static.openfoodfacts.org/images/attributes/dist/nutriscore-a-new-en.svg" alt="Nutri-Score A">
            <span class="t"><b>Nutri-Score A</b><i>Very good nutritional quality</i></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <a href="../03-home/home-app.html"><span class="g">&#9750;</span>Home</a>
    <a class="on"><span class="g">&#9678;</span>Scan</a>
    <a href="../08-lists/lists-history.html"><span class="g">&#9782;</span>Lists</a>
    <a href="../04-profile/profile-in.html"><span class="g">&#9787;</span>Profile</a>
  </div>

</div>

</body>
</html>
